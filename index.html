<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranim Obaia — Portfolio</title>
<meta name="description" content="Portfolio de Ranim Obaia, étudiante en Licence Business Computing (E-Business) à l'ESSECT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#ff7a59; --secondary:#fbbf24;
  --grad:linear-gradient(135deg,var(--primary),var(--secondary));
  --side:320px; --r:24px; --ease:cubic-bezier(.22,1,.36,1);
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#0b0806; --panel:#141009; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.08);
  --text:#f7efe6; --muted:#a89a8c; --dot:rgba(255,240,225,.10); --accent-text:#fdba74;
}
[data-theme="light"]{
  --bg:#fbf6f0; --panel:#ffffff; --card:#ffffff; --line:rgba(60,35,15,.10);
  --text:#2a1d14; --muted:#6e5c4e; --dot:rgba(60,35,15,.14); --accent-text:#c2410c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .5s var(--ease),color .5s var(--ease)}
html[dir="rtl"] body{font-family:"Noto Kufi Arabic","Plus Jakarta Sans",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
#dots{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:var(--mono)}
html[dir="rtl"] .mono{font-family:var(--mono),"Noto Kufi Arabic"}

/* ========== SIDEBAR ========== */
aside{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--side);z-index:40;display:flex;flex-direction:column;padding:34px 30px 28px;border-inline-end:1px solid var(--line);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.me{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:20px;padding:2px;background:var(--grad);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;border-radius:18px}
.me b{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.me small{color:var(--muted);font-size:.8rem}
.status{display:flex;align-items:center;gap:8px;margin-top:22px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;font-size:.8rem;color:var(--muted);background:var(--card)}
.status i{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 0 4px rgba(74,222,128,.15)}
nav.side-nav{margin-top:34px;display:flex;flex-direction:column;gap:2px}
nav.side-nav a{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;color:var(--muted);font-weight:500;font-size:.95rem;transition:.3s var(--ease);position:relative}
nav.side-nav a .n{font-family:var(--mono);font-size:.72rem;opacity:.6;width:20px}
nav.side-nav a::after{content:"";position:absolute;inset-inline-end:14px;width:6px;height:6px;border-radius:50%;background:var(--grad);opacity:0;transform:scale(0);transition:.3s var(--ease)}
nav.side-nav a:hover{color:var(--text);background:var(--card)}
nav.side-nav a.active{color:var(--text);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
nav.side-nav a.active::after{opacity:1;transform:scale(1)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.ctrls{display:flex;gap:8px}
.seg{flex:1;display:flex;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:10px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;transition:.3s}
.seg button.on{background:var(--grad);color:#fff}
.sq{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;transition:.3s var(--ease)}
.sq:hover{border-color:var(--primary)}
.sq svg{width:18px;height:18px}
.side-mail{font-size:.8rem;color:var(--muted)}
.side-mail a:hover{color:var(--text)}

/* mobile top bar */
.topbar{display:none}

/* ========== MAIN ========== */
main{margin-inline-start:var(--side);padding:0 clamp(24px,5vw,80px)}
section{max-width:960px;padding:110px 0 40px}
.label{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.78rem;color:var(--accent-text);margin-bottom:22px}
.label::after{content:"";flex:1;max-width:120px;height:1px;background:var(--line)}
h2{font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.1;font-weight:700;letter-spacing:-.03em;margin-bottom:14px}
html[dir="rtl"] h2{letter-spacing:0;line-height:1.45}
.sub{color:var(--muted);max-width:560px;margin-bottom:44px}

/* Hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:80px}
.hi{font-family:var(--mono);font-size:.9rem;color:var(--muted);margin-bottom:18px}
.hi span{color:var(--secondary)}
.hero h1{font-size:clamp(2.6rem,6.4vw,5.4rem);line-height:1.02;font-weight:800;letter-spacing:-.045em;max-width:900px}
html[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.35}
.rot{display:inline-block;position:relative}
.rot span{display:inline-block;transition:opacity .45s,transform .45s var(--ease)}
.rot span.out{opacity:0;transform:translateY(-14px)}
.hero p{margin-top:26px;color:var(--muted);font-size:1.1rem;max-width:600px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;border:0;font-weight:600;font-size:.95rem;cursor:pointer;transition:.35s var(--ease)}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--grad);color:#1f0f05;box-shadow:0 10px 30px -10px var(--secondary)}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 16px 40px -10px var(--secondary)}
.btn-o{border:1px solid var(--line);background:var(--card)}
.btn-o:hover{border-color:var(--primary);transform:translateY(-3px)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:64px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);max-width:760px}
.fact{background:color-mix(in srgb,var(--bg) 88%,transparent);padding:20px 22px}
.fact small{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:4px}
.fact b{font-weight:600;font-size:.98rem}

/* Marquee */
.marquee{direction:ltr;margin-top:70px;border-block:1px solid var(--line);overflow:hidden;padding:18px 0;max-width:960px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.track{display:flex;gap:44px;width:max-content;animation:mq 34s linear infinite}
.track span{font-family:var(--mono);font-size:.95rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:44px}
.track span::after{content:"✦";color:var(--secondary);font-size:.7rem}
@keyframes mq{to{transform:translateX(-50%)}}


/* Skills tabs */
.tabs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
.tablist{display:flex;flex-direction:column;gap:8px}
.tab{display:flex;align-items:center;gap:14px;text-align:start;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.3s var(--ease)}
.tab svg{width:20px;height:20px;flex:none;color:var(--muted);transition:.3s}
.tab span{font-weight:600;font-size:.95rem}
.tab:hover{border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.tab[aria-selected="true"]{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1px solid transparent}
.tab[aria-selected="true"] svg{color:var(--secondary)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:36px;min-height:100%;position:relative;overflow:hidden}
.panel .big{font-family:var(--mono);font-size:5rem;line-height:1;position:absolute;inset-inline-end:28px;top:20px;opacity:.07;font-weight:500}
.panel h3{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:10px}
.panel p{color:var(--muted);max-width:520px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.8rem;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 50%,transparent);transition:.3s}
.chip:hover{border-color:var(--secondary);color:var(--secondary)}
.panel-in{animation:fadeIn .5s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}

/* Projects */
.projects{display:grid;gap:26px}
.win{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;transition:.45s var(--ease)}
.win:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--primary) 40%,transparent);box-shadow:0 30px 60px -30px color-mix(in srgb,var(--primary) 60%,transparent)}
.bar{display:flex;align-items:center;gap:7px;padding:13px 18px;border-bottom:1px solid var(--line)}
.bar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.win:hover .bar i:nth-child(1){background:#f87171}.win:hover .bar i:nth-child(2){background:#fbbf24}.win:hover .bar i:nth-child(3){background:#4ade80}
.bar .url{margin-inline-start:12px;flex:1;max-width:340px;font-family:var(--mono);font-size:.74rem;color:var(--muted);padding:5px 12px;border-radius:8px;background:color-mix(in srgb,var(--bg) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:30px;padding:30px}
.win-body .ctx{font-family:var(--mono);font-size:.75rem;color:var(--accent-text);margin-bottom:8px}
.win-body h3{font-size:1.45rem;letter-spacing:-.02em;margin-bottom:10px;line-height:1.25}
.win-body p{color:var(--muted);font-size:.95rem}
.stack{border-inline-start:1px solid var(--line);padding-inline-start:24px}
.stack small{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:12px}
.stack ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.stack li{font-size:.88rem;font-weight:500;display:flex;gap:10px;align-items:center}
.stack li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--grad);flex:none}

/* Journey log + certs */
.log{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:24px;align-items:baseline;padding:24px 8px;border-bottom:1px solid var(--line);transition:.3s var(--ease)}
.row:hover{background:var(--card);padding-inline:20px}
.row .yr{font-family:var(--mono);font-size:.82rem;color:var(--accent-text)}
.row h4{font-size:1.08rem;font-weight:600}
.row p{color:var(--muted);font-size:.9rem}
.row .where{font-size:.85rem;color:var(--muted);text-align:end}
.certs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.cert{padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);transition:.4s var(--ease)}
.cert:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--secondary) 45%,transparent)}
.cert .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--accent-text);margin-bottom:16px}
.cert .ico svg{width:22px;height:22px}
.cert h4{font-size:.98rem;margin-bottom:4px;line-height:1.35}
.cert p{font-size:.84rem;color:var(--muted)}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.lang{padding:20px 24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:16px}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex:none;background:conic-gradient(var(--secondary) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:--p 1s}
.ring::before{content:"";width:38px;height:38px;border-radius:50%;background:var(--panel)}
.lang b{display:block;font-size:.95rem}
.lang small{color:var(--muted);font-size:.8rem}

/* Gallery */
.gallery{columns:3 220px;column-gap:16px}
.gallery button{display:block;width:100%;margin-bottom:16px;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:zoom-in;background:var(--card)}
.gallery img{width:100%;transition:.6s var(--ease)}
.gallery button:hover img{transform:scale(1.05)}
.lb{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(11,8,6,.94);padding:24px}
.lb.open{display:flex}
.lb img{max-height:86vh;border-radius:18px}
.lbb{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:1.4rem;cursor:pointer}
.lbx{top:20px;inset-inline-end:20px}.lbp{inset-inline-start:20px}.lbn{inset-inline-end:20px}

/* Contact */
.contact h2.huge{font-size:clamp(2.8rem,7vw,5.6rem);letter-spacing:-.05em;line-height:1}
html[dir="rtl"] .contact h2.huge{letter-spacing:0;line-height:1.3}
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:26px 0 50px}
.mailrow a.big{font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:600;border-bottom:2px solid var(--secondary);padding-bottom:2px;transition:.3s}
.mailrow a.big:hover{color:var(--secondary)}
.copy{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.8rem;font-family:var(--mono);cursor:pointer;transition:.3s}
.copy:hover{border-color:var(--primary)}
.copy svg{width:15px;height:15px}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}
form{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:32px;display:grid;gap:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fld{display:grid;gap:6px}
.fld label{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.fld input,.fld textarea{width:100%;font:inherit;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;border-radius:0;transition:.3s}
.fld input:focus,.fld textarea:focus{outline:none;border-bottom-color:var(--secondary)}
.fld textarea{min-height:110px;resize:vertical}
.ok{font-size:.85rem;color:#4ade80;min-height:1.2em}
.cside{display:flex;flex-direction:column;gap:12px}
.cline{display:flex;gap:14px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--card);transition:.3s}
a.cline:hover{border-color:var(--primary)}
.cline span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--accent-text);flex:none}
.cline svg{width:18px;height:18px}
.cline small{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.cline b{font-size:.9rem;font-weight:600;word-break:break-all}
footer{margin-inline-start:var(--side);padding:40px clamp(24px,5vw,80px) 46px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer b{color:var(--text)}

.rv{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ========== RESPONSIVE ========== */
@media (max-width:1100px){
  .win-body{grid-template-columns:1fr}
  .stack{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line);padding-top:20px}
  .stack ul{flex-direction:row;flex-wrap:wrap;gap:8px 18px}
  .cgrid{grid-template-columns:1fr}
}
@media (max-width:900px){
  aside{transform:translateX(-100%);transition:transform .45s var(--ease);width:min(320px,86vw);background:var(--panel)}
  html[dir="rtl"] aside{transform:translateX(100%)}
  aside.open,html[dir="rtl"] aside.open{transform:none}
  .topbar{display:flex;position:fixed;top:0;inset-inline:0;z-index:30;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .me .avatar{width:40px;height:40px;border-radius:13px}
  .topbar .me .avatar img{border-radius:11px}
  .topbar .me b{font-size:.98rem}
  .scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.3s}
  .scrim.on{opacity:1;pointer-events:auto}
  main,footer{margin-inline-start:0}
  main{padding:0 16px}
  footer{padding:30px 16px 40px}
  section{padding-top:90px}
  .tabs{grid-template-columns:1fr}
  .tablist{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .tab{flex:none}
  .certs,.langs{grid-template-columns:1fr}
}
@media (max-width:600px){
  .facts{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:4px}
  .row .where{text-align:start}
  .panel,.win-body,form{padding:24px}
  .f2{grid-template-columns:1fr}
  .bar .url{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="dots"></canvas>

<!-- Mobile top bar -->
<div class="topbar">
  <div class="me"><div class="avatar"><img src="photo.jpg" alt=""></div><div><b>Ranim Obaia</b></div></div>
  <button class="sq" id="openSide" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div class="scrim" id="scrim"></div>

<!-- Sidebar -->
<aside id="side">
  <div class="me">
    <div class="avatar"><img src="photo.jpg" alt="Ranim Obaia"></div>
    <div><b>Ranim Obaia</b><small data-i="side_role"></small></div>
  </div>
  <div class="status"><i></i><span data-i="status"></span></div>
  <nav class="side-nav" id="nav">
    <a href="#home"><span class="n">01</span><span data-i="nav_home"></span></a>
    <a href="#skills"><span class="n">02</span><span data-i="nav_skills"></span></a>
    <a href="#projects"><span class="n">03</span><span data-i="nav_projects"></span></a>
    <a href="#journey"><span class="n">04</span><span data-i="nav_journey"></span></a>
    <a href="#gallery" id="navGal"><span class="n">05</span><span data-i="nav_gallery"></span></a>
    <a href="#contact"><span class="n" id="contactNum">06</span><span data-i="nav_contact"></span></a>
  </nav>
  <div class="side-foot">
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Language"><button data-l="fr" class="on">FR</button><button data-l="en">EN</button><button data-l="ar">AR</button></div>
      <button class="sq" id="theme" aria-label="Theme">
        <svg id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="side-mail mono"><a href="mailto:ranimobaia@gmail.com">ranimobaia@gmail.com</a></div>
  </div>
</aside>

<main>
  <!-- HERO -->
  <section id="home" class="hero">
    <div class="hi"><span>~/</span>ranim-obaia <span>$</span> <span data-i="hi"></span></div>
    <h1 class="rv"><span data-i="h1a"></span> <span class="rot grad"><span id="rotWord"></span></span><br><span data-i="h1b"></span></h1>

/* ===== INTERACTIVE DOT GRID (particles) ===== */
const cv=$("dots"),cx=cv.getContext("2d"),DPR=Math.min(devicePixelRatio||1,2);
let W,H,pts=[],mx=-9999,my=-9999,tx=-9999,ty=-9999;
const GAP=30,R=170;
function build(){
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);pts=[];
  for(let y=GAP/2;y<H+GAP;y+=GAP)for(let x=GAP/2;x<W+GAP;x+=GAP)pts.push({x,y,ox:x,oy:y,vx:0,vy:0});
}
addEventListener("resize",build);
addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY});
addEventListener("pointerleave",()=>{tx=ty=-9999});
document.addEventListener("mouseleave",()=>{tx=ty=-9999});
function tick(t){
  mx+=(tx-mx)*.15;my+=(ty-my)*.15;
  if(tx<-9000){mx=my=-9999}
  cx.clearRect(0,0,W,H);
  const dotC=getComputedStyle(root).getPropertyValue("--dot").trim();
  const time=t*.0012;
  for(const p of pts){
    const dx=p.ox-mx,dy=p.oy-my,d=Math.hypot(dx,dy);
    let fx=0,fy=0,k=0;
    if(d<R){k=1-d/R;const push=k*k*22;fx=dx/(d||1)*push;fy=dy/(d||1)*push;}
    p.vx+=((p.ox+fx)-p.x)*.12;p.vy+=((p.oy+fy)-p.y)*.12;p.vx*=.72;p.vy*=.72;p.x+=p.vx;p.y+=p.vy;
    const wave=(Math.sin(p.ox*.012+time)+Math.cos(p.oy*.014-time*.8))*.5;
    const r=1+Math.max(0,wave)*.6+k*2.6;
    cx.beginPath();cx.arc(p.x,p.y,r,0,6.283);
    if(k>0){const mix=p.ox/W;cx.fillStyle=`rgba(${Math.round(255+(251-255)*mix)},${Math.round(122+(191-122)*mix)},${Math.round(89+(36-89)*mix)},${.25+k*.75})`;}
    else cx.fillStyle=dotC;
    cx.fill();
  }
  requestAnimationFrame(tick);
}
build();requestAnimationFrame(tick);
